<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Меню канала</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-monochrome-chrome card-dark">
  <div class="ambient-bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
  </div>

  <main class="stage">
    <section class="card-wrapper" id="cardWrapper">
      <article class="channel-card" id="channelCard">
        <div class="cover-box" id="coverBox">
          <div class="chrome-hero" id="chromeHero" aria-hidden="true">
            <svg class="chrome-waves" viewBox="0 0 440 160" preserveAspectRatio="none">
              <defs>
                <linearGradient id="metalA" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0b0c10" />
                  <stop offset="22%" stop-color="#525866" />
                  <stop offset="44%" stop-color="#f8fafc" />
                  <stop offset="56%" stop-color="#1e222b" />
                  <stop offset="78%" stop-color="#cbd5e1" />
                  <stop offset="100%" stop-color="#090a0d" />
                </linearGradient>
                <linearGradient id="metalB" x1="100%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
                  <stop offset="30%" stop-color="#64748b" stop-opacity="0.55" />
                  <stop offset="58%" stop-color="#0f1117" stop-opacity="0.9" />
                  <stop offset="82%" stop-color="#e2e8f0" stop-opacity="0.85" />
                  <stop offset="100%" stop-color="#181b22" stop-opacity="0.4" />
                </linearGradient>
                <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
                  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
                </linearGradient>
              </defs>
              <rect width="440" height="160" fill="#090a0e" />
              <path class="wave-layer wave-1" d="M-20,115 C60,35 150,155 245,75 C325,10 390,120 465,55 L465,175 L-20,175 Z" fill="url(#metalA)" />
              <path class="wave-layer wave-2" d="M-20,92 C75,148 165,18 270,88 C345,138 405,36 465,80 L465,175 L-20,175 Z" fill="url(#metalB)" opacity="0.88" />
              <path class="wave-layer wave-3" d="M-20,124 C95,62 190,145 295,62 C365,8 415,96 465,48" fill="none" stroke="url(#rimGlow)" stroke-width="2.2" />
            </svg>
            <div class="chrome-hero__sheen"></div>
            <div class="chrome-hero__badge" id="coverBadge">OFFICIAL HUB</div>
          </div>
          <img id="coverImg" alt="Обложка канала" hidden />
          <div class="cover-gloss"></div>
        </div>

        <div class="card-content" id="cardContent">
          <h1 class="brand-title" id="brandTitle">Добро пожаловать!</h1>
          <p class="brand-subtitle" id="brandSubtitle"></p>

          <div class="buttons-stack" id="buttonsStack"></div>
        </div>
      </article>

      <div class="starburst-dock" id="starburstDock"></div>
    </section>

    <footer class="miniapp-footer" id="previewBar" hidden>
      <span>Режим предпросмотра</span>
      <a href="./editor.html" class="footer-link">Открыть конструктор</a>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
