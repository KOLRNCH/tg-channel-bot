[project]
name = "tg-channel-bot"
version = "0.1.0"
description = "Telegram channel welcome post builder with styled inline buttons and per-user feedback topics"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.34.0",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
